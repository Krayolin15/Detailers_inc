<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <title>Detailers Inc - Staff Login</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;500;700;900&family=Rajdhani:wght@300;400;500;600;700&display=swap');

        * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

        body {
            font-family: 'Rajdhani', sans-serif;
            background: #000;
            color: #fff;
            overflow-x: hidden;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
            min-height: 100vh;
        }

        #canvas-container {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            z-index: 0;
        }

        .particles-overlay {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            z-index: 0;
            pointer-events: none;
            overflow: hidden;
        }

        .bubble {
            position: absolute;
            border-radius: 50%;
            background: radial-gradient(circle at 30% 30%, rgba(255,255,255,0.8), rgba(100,200,255,0.3), rgba(0,150,255,0.1));
            box-shadow: 0 0 20px rgba(100,200,255,0.3), inset 0 0 20px rgba(255,255,255,0.3);
            animation: float-up linear infinite;
            pointer-events: none;
        }

        @keyframes float-up {
            0% { transform: translateY(100vh) scale(0); opacity: 0; }
            10% { opacity: 1; }
            90% { opacity: 1; }
            100% { transform: translateY(-100px) scale(1); opacity: 0; }
        }

        .water-drop {
            position: absolute;
            width: 4px; height: 12px;
            background: linear-gradient(to bottom, rgba(255,255,255,0.9), rgba(0,200,255,0.6));
            border-radius: 50%;
            animation: rain-fall linear infinite;
            pointer-events: none;
        }

        @keyframes rain-fall {
            0% { transform: translateY(-50px); opacity: 0; }
            10% { opacity: 1; }
            90% { opacity: 1; }
            100% { transform: translateY(100vh); opacity: 0; }
        }

        .foam-particle {
            position: absolute;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(255,255,255,0.9), rgba(255,255,255,0.4));
            animation: foam-float ease-in-out infinite;
            pointer-events: none;
        }

        @keyframes foam-float {
            0%, 100% { transform: translateY(0) scale(1); opacity: 0.6; }
            50% { transform: translateY(-30px) scale(1.2); opacity: 1; }
        }

        .overlay {
            position: relative;
            z-index: 1;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 40px 20px;
            background: rgba(0,0,0,0.3);
        }

        .logo-container {
            text-align: center;
            margin-bottom: 40px;
            animation: fadeInDown 1s ease-out;
        }

        .logo-container h1 {
            font-family: 'Orbitron', sans-serif;
            font-size: 2.8rem;
            font-weight: 900;
            background: linear-gradient(135deg, #00d4ff, #0099cc, #00ffcc);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-shadow: 0 0 40px rgba(0,212,255,0.3);
            letter-spacing: 4px;
        }

        .logo-container p {
            font-size: 1rem;
            color: rgba(255,255,255,0.7);
            letter-spacing: 8px;
            text-transform: uppercase;
            margin-top: 5px;
        }

        .logo-container .staff-badge {
            display: inline-block;
            margin-top: 15px;
            padding: 8px 25px;
            background: rgba(0,212,255,0.1);
            border: 1px solid rgba(0,212,255,0.3);
            border-radius: 50px;
            font-family: 'Orbitron', sans-serif;
            font-size: 0.75rem;
            color: #00d4ff;
            letter-spacing: 4px;
            animation: pulse-glow 2s ease-in-out infinite;
        }

        @keyframes fadeInDown {
            from { opacity: 0; transform: translateY(-30px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @keyframes pulse-glow {
            0%, 100% { box-shadow: 0 0 20px rgba(0,212,255,0.1); }
            50% { box-shadow: 0 0 40px rgba(0,212,255,0.25); }
        }

        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(40px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .login-container {
            width: 100%;
            max-width: 420px;
            background: rgba(10,15,30,0.75);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(0,212,255,0.2);
            border-radius: 24px;
            padding: 45px 40px;
            box-shadow: 0 0 60px rgba(0,150,255,0.15), inset 0 0 60px rgba(0,100,200,0.05);
            animation: fadeInUp 1s ease-out 0.3s both;
            position: relative;
            overflow: hidden;
        }

        .login-container::before {
            content: '';
            position: absolute;
            top: -2px; left: -2px; right: -2px; bottom: -2px;
            background: linear-gradient(45deg, #00d4ff, transparent, #00ffcc, transparent, #00d4ff);
            border-radius: 24px;
            z-index: -1;
            opacity: 0.3;
            animation: border-rotate 4s linear infinite;
            background-size: 400% 400%;
        }

        @keyframes border-rotate {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        .login-icon {
            text-align: center;
            margin-bottom: 30px;
        }

        .login-icon i {
            font-size: 3.5rem;
            color: #00d4ff;
            filter: drop-shadow(0 0 20px rgba(0,212,255,0.4));
            animation: icon-float 3s ease-in-out infinite;
        }

        @keyframes icon-float {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-10px); }
        }

        .login-title {
            font-family: 'Orbitron', sans-serif;
            font-size: 1.3rem;
            text-align: center;
            margin-bottom: 8px;
            letter-spacing: 3px;
        }

        .login-subtitle {
            text-align: center;
            color: rgba(255,255,255,0.5);
            font-size: 0.9rem;
            margin-bottom: 30px;
            letter-spacing: 1px;
        }

        .form-group {
            margin-bottom: 22px;
            position: relative;
            animation: fadeInUp 0.6s ease-out both;
        }

        .form-group:nth-child(1) { animation-delay: 0.4s; }
        .form-group:nth-child(2) { animation-delay: 0.5s; }
        .form-group:nth-child(3) { animation-delay: 0.6s; }

        .form-group label {
            display: block;
            font-size: 0.85rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 2px;
            color: rgba(255,255,255,0.7);
            margin-bottom: 8px;
            transition: color 0.3s;
        }

        .form-group:focus-within label { color: #00d4ff; }

        .input-wrapper { position: relative; }

        .input-wrapper i.field-icon {
            position: absolute;
            left: 15px;
            top: 50%;
            transform: translateY(-50%);
            color: rgba(255,255,255,0.4);
            font-size: 1rem;
            transition: all 0.3s;
        }

        .form-group:focus-within .input-wrapper i.field-icon {
            color: #00d4ff;
            transform: translateY(-50%) scale(1.1);
        }

        .form-group input {
            width: 100%;
            padding: 14px 45px;
            background: rgba(255,255,255,0.05);
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 12px;
            color: #fff;
            font-family: 'Rajdhani', sans-serif;
            font-size: 1rem;
            outline: none;
            transition: all 0.3s ease;
        }

        .form-group input:focus {
            border-color: #00d4ff;
            background: rgba(0,212,255,0.05);
            box-shadow: 0 0 20px rgba(0,212,255,0.1);
        }

        .form-group input::placeholder { color: rgba(255,255,255,0.3); }

        .toggle-password {
            position: absolute;
            right: 15px;
            top: 50%;
            transform: translateY(-50%);
            color: rgba(255,255,255,0.4);
            font-size: 0.9rem;
            cursor: pointer;
            transition: all 0.3s;
            background: none;
            border: none;
            padding: 5px;
        }

        .toggle-password:hover { color: #00d4ff; }

        .login-btn {
            width: 100%;
            padding: 16px;
            background: linear-gradient(135deg, #00d4ff, #00a3cc);
            border: none;
            border-radius: 14px;
            color: #000;
            font-family: 'Orbitron', sans-serif;
            font-size: 1.1rem;
            font-weight: 700;
            letter-spacing: 3px;
            text-transform: uppercase;
            cursor: pointer;
            position: relative;
            overflow: hidden;
            transition: all 0.3s ease;
            animation: fadeInUp 0.6s ease-out 0.7s both;
            margin-top: 10px;
        }

        .login-btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 10px 40px rgba(0,212,255,0.4);
        }

        .login-btn:active { transform: translateY(-1px) scale(0.98); }

        .login-btn i {
            margin-left: 8px;
            animation: arrow-move 1s ease-in-out infinite;
        }

        @keyframes arrow-move {
            0%, 100% { transform: translateX(0); }
            50% { transform: translateX(5px); }
        }

        .back-link {
            display: block;
            text-align: center;
            margin-top: 25px;
            color: rgba(255,255,255,0.4);
            text-decoration: none;
            font-size: 0.85rem;
            letter-spacing: 2px;
            transition: all 0.3s;
            animation: fadeInUp 0.6s ease-out 0.8s both;
        }

        .back-link:hover { color: #00d4ff; }

        .back-link i { margin-right: 6px; }

        .error-message {
            display: none;
            align-items: center;
            gap: 10px;
            padding: 14px 18px;
            background: rgba(255, 68, 68, 0.1);
            border: 1px solid rgba(255, 68, 68, 0.3);
            border-radius: 12px;
            margin-bottom: 20px;
            color: #ff8888;
            font-size: 0.9rem;
            animation: shake 0.5s ease-out;
        }

        .error-message.active { display: flex; }

        .error-message i { color: #ff4444; font-size: 1.1rem; }

        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            20% { transform: translateX(-10px); }
            40% { transform: translateX(10px); }
            60% { transform: translateX(-5px); }
            80% { transform: translateX(5px); }
        }

        .security-notice {
            text-align: center;
            margin-top: 20px;
            padding-top: 20px;
            border-top: 1px solid rgba(255,255,255,0.08);
            color: rgba(255,255,255,0.3);
            font-size: 0.75rem;
            letter-spacing: 1px;
            animation: fadeInUp 0.6s ease-out 0.9s both;
        }

        .security-notice i {
            color: #00d4ff;
            margin-right: 6px;
        }

        .loading-overlay {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: rgba(0,0,0,0.92);
            z-index: 1000;
            display: none;
            justify-content: center;
            align-items: center;
            flex-direction: column;
        }

        .loading-overlay.active { display: flex; }

        .spinner-ring {
            width: 60px; height: 60px;
            border: 4px solid rgba(0,212,255,0.2);
            border-top-color: #00d4ff;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin-bottom: 20px;
        }

        @keyframes spin { to { transform: rotate(360deg); } }

        .loader-text {
            font-family: 'Orbitron', sans-serif;
            font-size: 1.2rem;
            letter-spacing: 4px;
            color: #00d4ff;
            animation: text-pulse 1.5s ease-in-out infinite;
        }

        @keyframes text-pulse {
            0%, 100% { opacity: 0.5; }
            50% { opacity: 1; }
        }

        @media (max-width: 480px) {
            .logo-container h1 { font-size: 2rem; letter-spacing: 2px; }
            .logo-container p { letter-spacing: 4px; font-size: 0.85rem; }
            .login-container { padding: 30px 25px; margin: 0 5px; }
            .login-title { font-size: 1.1rem; }
            .overlay { padding: 20px 10px; }
        }
    </style>
</head>
<body>

<div id="canvas-container"></div>
<div class="particles-overlay" id="particles"></div>

<div class="overlay">
    <div class="logo-container">
        <h1>DETAILERS INC</h1>
        <p>Premium Mobile Car Care</p>
        <div class="staff-badge"><i class="fas fa-shield-alt"></i> STAFF PORTAL</div>
    </div>

    <div class="login-container">
        <div class="login-icon">
            <i class="fas fa-user-shield"></i>
        </div>
        <h2 class="login-title">STAFF LOGIN</h2>
        <p class="login-subtitle">Enter your credentials to access the dashboard</p>

        <div class="error-message" id="errorMessage">
            <i class="fas fa-exclamation-circle"></i>
            <span id="errorText">Invalid username or password</span>
        </div>

        <form id="loginForm" novalidate>
            <div class="form-group">
                <label>Username</label>
                <div class="input-wrapper">
                    <i class="fas fa-user field-icon"></i>
                    <input type="text" id="username" placeholder="Enter username" required autocomplete="username">
                </div>
            </div>

            <div class="form-group">
                <label>Password</label>
                <div class="input-wrapper">
                    <i class="fas fa-lock field-icon"></i>
                    <input type="password" id="password" placeholder="Enter password" required autocomplete="current-password">
                    <button type="button" class="toggle-password" id="togglePassword" tabindex="-1">
                        <i class="fas fa-eye"></i>
                    </button>
                </div>
            </div>

            <button type="submit" class="login-btn" id="loginBtn">
                LOGIN <i class="fas fa-arrow-right"></i>
            </button>
        </form>

        <a href="index.html" class="back-link">
            <i class="fas fa-arrow-left"></i> Back to Website
        </a>

        <div class="security-notice">
            <i class="fas fa-lock"></i> Secure Staff Access Only
        </div>
    </div>
</div>

<div class="loading-overlay" id="loadingOverlay">
    <div class="spinner-ring"></div>
    <div class="loader-text">AUTHENTICATING...</div>
</div>

<script>
// ========================
// INITIALIZE STAFF ACCOUNTS
// ========================
(function initStaffAccounts() {
    const accounts = localStorage.getItem('detailersStaffAccounts');
    if (!accounts) {
        const defaultAccounts = [
            { username: 'admin', password: 'admin123', name: 'Administrator', role: 'Admin' },
            { username: 'staff', password: 'staff123', name: 'Staff Member', role: 'Staff' }
        ];
        localStorage.setItem('detailersStaffAccounts', JSON.stringify(defaultAccounts));
    }
})();

// ========================
// CHECK EXISTING SESSION
// ========================
(function checkSession() {
    const session = localStorage.getItem('detailersStaffSession');
    if (session) {
        const sessionData = JSON.parse(session);
        const now = Date.now();
        if (sessionData.expiresAt && now < sessionData.expiresAt) {
            window.location.href = 'dashboard.html';
        } else {
            localStorage.removeItem('detailersStaffSession');
        }
    }
})();

// ========================
// THREE.JS 3D CAR WASH SCENE
// ========================
(function initThreeJS() {
    const container = document.getElementById('canvas-container');
    const scene = new THREE.Scene();
    scene.fog = new THREE.FogExp2(0x000510, 0.02);

    const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
    const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.toneMapping = THREE.ReinhardToneMapping;
    container.appendChild(renderer.domElement);

    camera.position.set(0, 3, 8);
    camera.lookAt(0, 1, 0);

    const ambientLight = new THREE.AmbientLight(0x001133, 0.5);
    scene.add(ambientLight);

    const mainLight = new THREE.PointLight(0x00d4ff, 2, 50);
    mainLight.position.set(5, 8, 5);
    scene.add(mainLight);

    const secondLight = new THREE.PointLight(0x00ffcc, 1.5, 40);
    secondLight.position.set(-5, 6, -5);
    scene.add(secondLight);

    const floorGeometry = new THREE.PlaneGeometry(40, 40);
    const floorMaterial = new THREE.MeshStandardMaterial({
        color: 0x001122, roughness: 0.1, metalness: 0.8
    });
    const floor = new THREE.Mesh(floorGeometry, floorMaterial);
    floor.rotation.x = -Math.PI / 2;
    floor.position.y = -0.5;
    scene.add(floor);

    const gridHelper = new THREE.GridHelper(40, 40, 0x00d4ff, 0x003355);
    gridHelper.position.y = -0.48;
    gridHelper.material.opacity = 0.3;
    gridHelper.material.transparent = true;
    scene.add(gridHelper);

    const carGroup = new THREE.Group();
    const carBodyMat = new THREE.MeshPhysicalMaterial({
        color: 0x00aaff, metalness: 0.7, roughness: 0.2,
        clearcoat: 1, clearcoatRoughness: 0.1, reflectivity: 1
    });
    const carGlassMat = new THREE.MeshPhysicalMaterial({
        color: 0x112233, metalness: 0.9, roughness: 0.05,
        transparent: true, opacity: 0.7
    });
    const wheelMat = new THREE.MeshStandardMaterial({ color: 0x111111, roughness: 0.8 });
    const rimMat = new THREE.MeshStandardMaterial({ color: 0xcccccc, metalness: 0.9, roughness: 0.1 });
    const lightMat = new THREE.MeshStandardMaterial({ color: 0xffffff, emissive: 0x00d4ff, emissiveIntensity: 2 });

    const bodyGeom = new THREE.BoxGeometry(2.2, 0.7, 4.5);
    const body = new THREE.Mesh(bodyGeom, carBodyMat);
    body.position.y = 0.6;
    carGroup.add(body);

    const cabinGeom = new THREE.BoxGeometry(1.8, 0.6, 2.5);
    const cabin = new THREE.Mesh(cabinGeom, carGlassMat);
    cabin.position.set(0, 1.2, -0.3);
    carGroup.add(cabin);

    const roofGeom = new THREE.BoxGeometry(1.9, 0.1, 2.6);
    const roof = new THREE.Mesh(roofGeom, carBodyMat);
    roof.position.set(0, 1.55, -0.3);
    carGroup.add(roof);

    function createWheel(x, z) {
        const wheelGroup = new THREE.Group();
        const tireGeom = new THREE.CylinderGeometry(0.35, 0.35, 0.25, 24);
        tireGeom.rotateZ(Math.PI / 2);
        const tire = new THREE.Mesh(tireGeom, wheelMat);
        const rimGeom = new THREE.CylinderGeometry(0.22, 0.22, 0.26, 16);
        rimGeom.rotateZ(Math.PI / 2);
        const rim = new THREE.Mesh(rimGeom, rimMat);
        wheelGroup.add(tire);
        wheelGroup.add(rim);
        wheelGroup.position.set(x, 0.35, z);
        return wheelGroup;
    }

    carGroup.add(createWheel(1.1, 1.4));
    carGroup.add(createWheel(-1.1, 1.4));
    carGroup.add(createWheel(1.1, -1.4));
    carGroup.add(createWheel(-1.1, -1.4));

    const headlightGeom = new THREE.BoxGeometry(0.5, 0.2, 0.1);
    const headlightL = new THREE.Mesh(headlightGeom, lightMat);
    headlightL.position.set(0.6, 0.7, 2.26);
    carGroup.add(headlightL);
    const headlightR = new THREE.Mesh(headlightGeom, lightMat);
    headlightR.position.set(-0.6, 0.7, 2.26);
    carGroup.add(headlightR);

    scene.add(carGroup);

    const waterParticles = [];
    const waterGeom = new THREE.SphereGeometry(0.03, 6, 6);
    const waterMat = new THREE.MeshBasicMaterial({ color: 0x00d4ff, transparent: true, opacity: 0.6 });

    for (let i = 0; i < 200; i++) {
        const particle = new THREE.Mesh(waterGeom, waterMat.clone());
        particle.position.set(
            (Math.random() - 0.5) * 8,
            Math.random() * 6 + 1,
            (Math.random() - 0.5) * 8
        );
        particle.userData = {
            velocity: new THREE.Vector3(
                (Math.random() - 0.5) * 0.05,
                -Math.random() * 0.1 - 0.05,
                (Math.random() - 0.5) * 0.05
            )
        };
        scene.add(particle);
        waterParticles.push(particle);
    }

    const bubbles = [];
    const bubbleGeom = new THREE.SphereGeometry(0.15, 16, 16);
    const bubbleMat = new THREE.MeshPhysicalMaterial({
        color: 0xffffff, transparent: true, opacity: 0.3,
        roughness: 0, metalness: 0.1, clearcoat: 1, transmission: 0.9
    });

    for (let i = 0; i < 50; i++) {
        const bubble = new THREE.Mesh(bubbleGeom, bubbleMat.clone());
        bubble.position.set(
            (Math.random() - 0.5) * 10,
            Math.random() * 5,
            (Math.random() - 0.5) * 10
        );
        bubble.scale.setScalar(Math.random() * 0.5 + 0.5);
        bubble.userData = {
            speed: Math.random() * 0.02 + 0.01,
            wobble: Math.random() * Math.PI * 2,
            wobbleSpeed: Math.random() * 2 + 1
        };
        scene.add(bubble);
        bubbles.push(bubble);
    }

    const clock = new THREE.Clock();

    function animate() {
        requestAnimationFrame(animate);
        const time = clock.getElapsedTime();

        carGroup.rotation.y = time * 0.3;
        carGroup.position.y = Math.sin(time * 0.5) * 0.1;

        waterParticles.forEach(p => {
            p.position.add(p.userData.velocity);
            p.material.opacity = Math.max(0, p.material.opacity - 0.005);
            if (p.position.y < -0.5 || p.material.opacity <= 0) {
                p.position.set(
                    (Math.random() - 0.5) * 8,
                    Math.random() * 3 + 3,
                    (Math.random() - 0.5) * 8
                );
                p.material.opacity = 0.6;
            }
        });

        bubbles.forEach(b => {
            b.position.y += b.userData.speed;
            b.position.x += Math.sin(time * b.userData.wobbleSpeed + b.userData.wobble) * 0.01;
            b.position.z += Math.cos(time * b.userData.wobbleSpeed + b.userData.wobble) * 0.01;
            if (b.position.y > 8) {
                b.position.y = -1;
                b.position.x = (Math.random() - 0.5) * 10;
                b.position.z = (Math.random() - 0.5) * 10;
            }
        });

        mainLight.intensity = 2 + Math.sin(time * 2) * 0.5;
        secondLight.intensity = 1.5 + Math.cos(time * 1.5) * 0.5;

        camera.position.x = Math.sin(time * 0.2) * 0.5;
        camera.position.y = 3 + Math.sin(time * 0.3) * 0.3;
        camera.lookAt(0, 1, 0);

        renderer.render(scene, camera);
    }

    animate();

    window.addEventListener('resize', () => {
        camera.aspect = window.innerWidth / window.innerHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(window.innerWidth, window.innerHeight);
    });
})();

// ========================
// 2D PARTICLE EFFECTS
// ========================
const particlesContainer = document.getElementById('particles');

function createCSSBubble() {
    const bubble = document.createElement('div');
    bubble.className = 'bubble';
    const size = Math.random() * 60 + 20;
    bubble.style.width = size + 'px';
    bubble.style.height = size + 'px';
    bubble.style.left = Math.random() * 100 + '%';
    bubble.style.animationDuration = (Math.random() * 8 + 6) + 's';
    bubble.style.animationDelay = Math.random() * 5 + 's';
    particlesContainer.appendChild(bubble);
    setTimeout(() => bubble.remove(), 15000);
}

function createWaterDrop() {
    const drop = document.createElement('div');
    drop.className = 'water-drop';
    drop.style.left = Math.random() * 100 + '%';
    drop.style.animationDuration = (Math.random() * 1 + 0.5) + 's';
    drop.style.animationDelay = Math.random() * 2 + 's';
    particlesContainer.appendChild(drop);
    setTimeout(() => drop.remove(), 3000);
}

function createFoam() {
    const foam = document.createElement('div');
    foam.className = 'foam-particle';
    const size = Math.random() * 30 + 10;
    foam.style.width = size + 'px';
    foam.style.height = size + 'px';
    foam.style.left = Math.random() * 100 + '%';
    foam.style.bottom = Math.random() * 20 + '%';
    foam.style.animationDuration = (Math.random() * 4 + 3) + 's';
    particlesContainer.appendChild(foam);
    setTimeout(() => foam.remove(), 8000);
}

setInterval(createCSSBubble, 800);
setInterval(createWaterDrop, 200);
setInterval(createFoam, 1000);

for (let i = 0; i < 15; i++) createCSSBubble();
for (let i = 0; i < 30; i++) createWaterDrop();
for (let i = 0; i < 20; i++) createFoam();

// ========================
// PASSWORD TOGGLE
// ========================
document.getElementById('togglePassword').addEventListener('click', function() {
    const pwdInput = document.getElementById('password');
    const icon = this.querySelector('i');
    if (pwdInput.type === 'password') {
        pwdInput.type = 'text';
        icon.className = 'fas fa-eye-slash';
    } else {
        pwdInput.type = 'password';
        icon.className = 'fas fa-eye';
    }
});

// ========================
// LOGIN FORM HANDLING
// ========================
const loginForm = document.getElementById('loginForm');
const errorMessage = document.getElementById('errorMessage');
const errorText = document.getElementById('errorText');
const loadingOverlay = document.getElementById('loadingOverlay');

loginForm.addEventListener('submit', function(e) {
    e.preventDefault();
    errorMessage.classList.remove('active');

    const username = document.getElementById('username').value.trim();
    const password = document.getElementById('password').value;

    if (!username || !password) {
        errorText.textContent = 'Please enter both username and password';
        errorMessage.classList.add('active');
        return;
    }

    loadingOverlay.classList.add('active');

    setTimeout(() => {
        const accounts = JSON.parse(localStorage.getItem('detailersStaffAccounts') || '[]');
        const account = accounts.find(a => a.username === username && a.password === password);

        if (account) {
            const sessionData = {
                username: account.username,
                name: account.name,
                role: account.role,
                loginTime: new Date().toISOString(),
                expiresAt: Date.now() + (24 * 60 * 60 * 1000)
            };
            localStorage.setItem('detailersStaffSession', JSON.stringify(sessionData));
            window.location.href = 'dashboard.html';
        } else {
            loadingOverlay.classList.remove('active');
            errorText.textContent = 'Invalid username or password';
            errorMessage.classList.add('active');
            document.getElementById('password').value = '';
            document.getElementById('password').focus();
        }
    }, 1000);
});

// Form field focus animations
const inputs = document.querySelectorAll('input');
inputs.forEach(input => {
    input.addEventListener('focus', () => {
        const parent = input.closest('.form-group');
        if (parent) {
            parent.style.transform = 'scale(1.02)';
            parent.style.transition = 'transform 0.3s';
        }
    });
    input.addEventListener('blur', () => {
        const parent = input.closest('.form-group');
        if (parent) {
            parent.style.transform = 'scale(1)';
        }
    });
});
</script>
